<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Writer</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #666; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --muted: #999; --line: #333; } }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: 18px; margin: 28px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 12px 0; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  li:last-child { border-bottom: 1px solid var(--line); }
  .t { font-weight: 600; flex: 1 1 200px; }
  .m { color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); }
  code { background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 4px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Post Writer</h1>
  <p class="sub">The pony express for ink. Send a Supernote note to someone on the tailnet.</p>
  <p id="me">Checking who you are…</p>
  <h2>Inbox</h2>
  <ul id="inbox"></ul>
  <h2>Sent</h2>
  <ul id="sent"></ul>
  <h2>People</h2>
  <ul id="users"></ul>
  <footer>
    Pull notes from the Supernote plugin (Inbox → Pull); this page only shows status.
    API: <a href="/llms.txt">/llms.txt</a>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = (s) => s ? new Date(s.replace(' ', 'T') + 'Z').toLocaleString() : '';
async function api(path) {
  const r = await fetch('/api' + path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
function render(el, rows, line, empty) {
  el.innerHTML = rows.length ? rows.map(line).join('') : `<li class="empty">${empty}</li>`;
}
(async () => {
  try {
    const me = await api('/me');
    $('me').innerHTML = `You are <code>${esc(me.login)}</code>.`;
    const [inbox, sent, users] = await Promise.all([api('/inbox'), api('/sent'), api('/users')]);
    render($('inbox'), inbox, (m) => `<li><span class="t">${esc(m.title)}</span><span class="m">from ${esc(m.from)} · ${m.pages} page${m.pages === 1 ? '' : 's'} · ${when(m.created_at)}</span></li>`, 'Nothing waiting.');
    render($('sent'), sent, (m) => `<li><span class="t">${esc(m.title)}</span><span class="m">to ${esc(m.to)} · ${when(m.created_at)} · ${m.delivered_at ? 'pulled ' + when(m.delivered_at) : 'not pulled yet'}</span></li>`, 'Nothing sent yet.');
    render($('users'), users, (u) => `<li><span class="t">${esc(u.name)}</span><span class="m">${esc(u.login)} · seen ${when(u.last_seen)}</span></li>`, 'No one else has opened Post Writer yet.');
  } catch (e) {
    $('me').textContent = 'Not signed in: ' + e.message;
  }
})();
</script>
</body>
</html>
